services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - gateway
    - article_splitter_0
    - article_splitter_1
    - year_filter_0
    - year_filter_1
    - language_filter_0
    - biography_filter_0
    - image_downloader_0
    - tokenizer_0
    - tokenizer_1
    - sum_0
    - sum_join_0
    - average_filter_0
    environment:
    - INPUT_FILE=/datasets
    - OUTPUT_DIR=/output
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - ROW_BATCH_SIZE=1000
    - QUERIES=1,2,5
    volumes:
    - ./datasets:/datasets
    - ./output:/output

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBITMQ_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - RESULTS_QUEUE=results_queue
    - RAW_ARTICLES_QUEUE=raw_articles_queue
    - QUERIES=1,2,5
    - Q1_EOF_EXPECTED=1
    - Q2_EOF_EXPECTED=1
    - Q5_EOF_EXPECTED=1

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672

  article_splitter_0:
    build:
      context: ./src/
      dockerfile: article_splitter/Dockerfile
    container_name: article_splitter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=0
    - INPUT_QUEUE_NAME=raw_articles_queue
    - YEAR_OUTPUT_QUEUE_NAME=year_filter_queue
    - TOKENIZER_OUTPUT_QUEUE_NAME=tokenizer_queue
    - CONTROL_EXCHANGE_NAME=article_splitter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=1
    - PYTHONUNBUFFERED=1

  article_splitter_1:
    build:
      context: ./src/
      dockerfile: article_splitter/Dockerfile
    container_name: article_splitter_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=1
    - INPUT_QUEUE_NAME=raw_articles_queue
    - YEAR_OUTPUT_QUEUE_NAME=year_filter_queue
    - TOKENIZER_OUTPUT_QUEUE_NAME=tokenizer_queue
    - CONTROL_EXCHANGE_NAME=article_splitter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=1
    - PYTHONUNBUFFERED=1

  year_filter_0:
    build:
      context: ./src/
      dockerfile: year_filter/Dockerfile
    container_name: year_filter_0
    depends_on:
    - article_splitter_0
    - article_splitter_1
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=0
    - INPUT_QUEUE_NAME=year_filter_queue
    - Q1_OUTPUT_QUEUE_NAME=article_language_queue
    - Q2_OUTPUT_QUEUE_NAME=article_sections_queue
    - CONTROL_EXCHANGE_NAME=year_filter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=2
    - PYTHONUNBUFFERED=1

  year_filter_1:
    build:
      context: ./src/
      dockerfile: year_filter/Dockerfile
    container_name: year_filter_1
    depends_on:
    - article_splitter_0
    - article_splitter_1
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=1
    - INPUT_QUEUE_NAME=year_filter_queue
    - Q1_OUTPUT_QUEUE_NAME=article_language_queue
    - Q2_OUTPUT_QUEUE_NAME=article_sections_queue
    - CONTROL_EXCHANGE_NAME=year_filter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=2
    - PYTHONUNBUFFERED=1

  language_filter_0:
    build:
      context: ./src/
      dockerfile: language_filter/Dockerfile
    container_name: language_filter_0
    depends_on:
    - year_filter_0
    - year_filter_1
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=0
    - INPUT_QUEUE_NAME=article_language_queue
    - Q1_OUTPUT_QUEUE_NAME=results_queue
    - CONTROL_EXCHANGE_NAME=language_filter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=2
    - PYTHONUNBUFFERED=1

  biography_filter_0:
    build:
      context: ./src/
      dockerfile: biography_filter/Dockerfile
    container_name: biography_filter_0
    depends_on:
    - year_filter_0
    - year_filter_1
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=0
    - INPUT_QUEUE_NAME=article_sections_queue
    - Q2_OUTPUT_QUEUE_NAME=image_queue
    - CONTROL_EXCHANGE_NAME=biography_filter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=2
    - PYTHONUNBUFFERED=1

  image_downloader_0:
    build:
      context: ./src/
      dockerfile: image_downloader/Dockerfile
    container_name: image_downloader_0
    depends_on:
    - biography_filter_0
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=0
    - INPUT_QUEUE_NAME=image_queue
    - Q2_OUTPUT_QUEUE_NAME=results_queue
    - CONTROL_EXCHANGE_NAME=image_downloader_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=1
    - PYTHONUNBUFFERED=1

  tokenizer_0:
    build:
      context: ./src/
      dockerfile: tokenizer/Dockerfile
    container_name: tokenizer_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      article_splitter_0:
        condition: service_started
      article_splitter_1:
        condition: service_started
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=0
    - INPUT_QUEUE_NAME=tokenizer_queue
    - Q3_4_OUTPUT_QUEUE_NAME=words_without_stopwords_queue
    - Q5_SUM_OUTPUT_QUEUE_NAME=abstracts_length_queue
    - Q5_AVERAGE_FILTER_OUTPUT_QUEUE_NAME=recent_queue
    - CONTROL_EXCHANGE_NAME=tokenizer_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=2
    - PYTHONUNBUFFERED=1

  tokenizer_1:
    build:
      context: ./src/
      dockerfile: tokenizer/Dockerfile
    container_name: tokenizer_1
    depends_on:
      rabbitmq:
        condition: service_healthy
      article_splitter_0:
        condition: service_started
      article_splitter_1:
        condition: service_started
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=1
    - INPUT_QUEUE_NAME=tokenizer_queue
    - Q3_4_OUTPUT_QUEUE_NAME=words_without_stopwords_queue
    - Q5_SUM_OUTPUT_QUEUE_NAME=abstracts_length_queue
    - Q5_AVERAGE_FILTER_OUTPUT_QUEUE_NAME=recent_queue
    - CONTROL_EXCHANGE_NAME=tokenizer_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PREVIOUS_STAGE_REPLICAS=2
    - PYTHONUNBUFFERED=1

  sum_0:
    build:
      context: ./src/
      dockerfile: sum/Dockerfile
    container_name: sum_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      sum_join_0:
        condition: service_started
    environment:
    - RABBITMQ_HOST=rabbitmq
    - REPLICA_ID=0
    - PREVIOUS_STAGE_REPLICAS=2
    - INPUT_QUEUE_NAME=abstracts_length_queue
    - CONTROL_EXCHANGE_NAME=sum_control
    - CONTROL_ROUTING_KEY=
    - SUM_JOIN_EXCHANGE=sum_join
    - SUM_JOIN_AMOUNT=1
    - BATCH_SIZE=100
    - PYTHONUNBUFFERED=1

  sum_join_0:
    build:
      context: ./src/
      dockerfile: sum_join/Dockerfile
    container_name: sum_join_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      average_filter_0:
        condition: service_started
    environment:
    - RABBITMQ_HOST=rabbitmq
    - REPLICA_ID=0
    - PREVIOUS_STAGE_REPLICAS=1
    - SUM_JOIN_EXCHANGE=sum_join
    - AVERAGE_EXCHANGE=average
    - AVERAGE_FILTER_AMOUNT=1
    - BATCH_SIZE=10
    - PYTHONUNBUFFERED=1

  average_filter_0:
    build:
      context: ./src/
      dockerfile: average_filter/Dockerfile
    container_name: average_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBITMQ_HOST=rabbitmq
    - BATCH_SIZE=10
    - REPLICA_ID=0
    - CONTROL_EXCHANGE_NAME=average_filter_control
    - RECENT_QUEUE_NAME=recent_queue
    - AVERAGE_EXCHANGE=average
    - RESULTS_QUEUE_NAME=results_queue
    - TOKENIZER_REPLICAS=2
    - SUM_JOIN_AMOUNT=1
    - STORE_PATH=/tmp/average_filter_store
    - PYTHONUNBUFFERED=1