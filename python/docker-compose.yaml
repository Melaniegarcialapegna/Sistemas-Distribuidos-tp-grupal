services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - year_filter_0
    environment:
    - INPUT_FILE=/datasets/test2.parquet
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBITMQ_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - RESULTS_QUEUE=results_queue
    - TOKENIZER_QUEUE=tokenizer_queue
    - YEAR_FILTER_QUEUE=year_filter_queue
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  year_filter_0:
    build:
      context: ./src/
      dockerfile: year_filter/Dockerfile
    container_name: year_filter_0
    depends_on:
    - gateway
    environment:
    - BATCH_SIZE=100
    - ID=0
    - INPUT_QUEUE_NAME=year_filter_queue
    - Q1_OUTPUT_QUEUE_NAME=article_language_queue
    - Q2_OUTPUT_QUEUE_NAME=article_sections_queue
    - CONTROL_EXCHANGE_NAME=year_filter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PYTHONUNBUFFERED=1

  language_filter_0:
    build:
      context: ./src/
      dockerfile: language_filter/Dockerfile
    container_name: language_filter_0
    depends_on:
    - year_filter_0
    environment:
    - BATCH_SIZE=100
    - ID=0
    - INPUT_QUEUE_NAME=article_language_queue
    - Q1_OUTPUT_QUEUE_NAME=results_queue
    - CONTROL_EXCHANGE_NAME=language_filter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq

  biography_filter_0:
    build:
      context: ./src/
      dockerfile: biography_filter/Dockerfile
    container_name: biography_filter_0
    depends_on:
    - year_filter_0
    environment:
    - BATCH_SIZE=100
    - ID=0
    - INPUT_QUEUE_NAME=article_sections_queue
    - Q2_OUTPUT_QUEUE_NAME=results_queue
    - CONTROL_EXCHANGE_NAME=biography_filter_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq