    - gateway
    - year_filter_0
    - year_filter_1
    - year_filter_2
    - language_filter_0
    - language_filter_1
    - language_filter_2
    - biography_filter_0
    - biography_filter_1
    - biography_filter_2
    - image_downloader_0
    - image_downloader_1
    - image_downloader_2
    - tokenizer_0
    - tokenizer_1
    - tokenizer_2
    - unique_words_filter_0
    - unique_words_filter_1
    - unique_words_filter_2
    - hasher_0
    - hasher_1
    - hasher_2
    - word_counter_0
    - word_counter_1
    - word_counter_2
    - join_top_20_0
    - join_top_20_1
    - join_top_20_2
    - sum_0
    - sum_1
    - sum_2
    - sum_join_0
    - sum_join_1
    - sum_join_2
    - average_filter_0
    - average_filter_1
    - average_filter_2
    environment:
    - INPUT_FILE=/datasets/5
    - OUTPUT_DIR=/output/client_0
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - ROW_BATCH_SIZE=1000
    - QUERIES=1,2,3,4,5
    volumes:
    - ./datasets:/datasets
    - ./output:/output


  client_1:
