    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - ROW_BATCH_SIZE=1000
    - QUERIES=1,2,3,4,5
    volumes:
    - ./datasets:/datasets
    - ./output:/output

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBITMQ_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - RESULTS_QUEUE=results_queue
    - TOKENIZER_QUEUE=tokenizer_queue
    - YEAR_FILTER_QUEUE=year_filter_queue
    - QUERIES=1,2,3,4,5
    - Q1_EOF_EXPECTED=3
    - Q2_EOF_EXPECTED=3
    - Q3_EOF_EXPECTED=3
    - Q4_EOF_EXPECTED=3
    - Q5_EOF_EXPECTED=3

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672

  year_filter_0:
    build:
