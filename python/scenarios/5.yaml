services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    -  tokenizer_0
    -  sum_worker_0
    -  sum_join_0
    -  average_filter_0
    -  gateway
    environment:
    - INPUT_FILE=/datasets/test.parquet
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBITMQ_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - RESULTS_QUEUE=results_queue
    - TOKENIZER_QUEUE=tokenizer_queue
    - YEAR_FILTER_QUEUE=year_filter_queue
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  tokenizer_0:
    build:
      context: ./src/
      dockerfile: tokenizer/Dockerfile
    container_name: tokenizer_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - BATCH_SIZE=100
    - REPLICA_ID=0
    - INPUT_QUEUE_NAME=tokenizer_queue
    - Q3_4_OUTPUT_QUEUE_NAME=words_without_stopwords_queue
    - Q5_SUM_OUTPUT_QUEUE_NAME=abstracts_length_queue
    - Q5_AVERAGE_FILTER_OUTPUT_QUEUE_NAME=recent_queue
    - CONTROL_EXCHANGE_NAME=tokenizer_control
    - CONTROL_ROUTING_KEY=
    - RABBITMQ_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
  sum_0:
    build:
      context: ./src/
      dockerfile: sum/Dockerfile
    container_name: sum_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      sum_join_0:
        condition: service_started
    environment:
    - RABBITMQ_HOST=rabbitmq
    - REPLICA_ID=0
    - PREVIOUS_STAGE_REPLICAS=1
    - INPUT_QUEUE_NAME=abstracts_length_queue
    - CONTROL_EXCHANGE_NAME=sum_control
    - CONTROL_ROUTING_KEY=
    - SUM_JOIN_EXCHANGE=sum_join
    - SUM_JOIN_AMOUNT=1
    - BATCH_SIZE=100
    - PYTHONUNBUFFERED=1
  sum_join_0:
    build:
      context: ./src/
      dockerfile: sum_join/Dockerfile
    container_name: sum_join_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      average_filter_0:
        condition: service_started
    environment:
    - RABBITMQ_HOST=rabbitmq
    - REPLICA_ID=0
    - PREVIOUS_STAGE_REPLICAS=1
    - SUM_JOIN_EXCHANGE=sum_join
    - AVERAGE_EXCHANGE=average
    - AVERAGE_FILTER_AMOUNT=1
    - BATCH_SIZE=10
    - PYTHONUNBUFFERED=1
  average_filter_0:
    build:
      context: ./src/
      dockerfile: average_filter/Dockerfile
    container_name: average_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      sum_join_0:
        condition: service_started
    environment:
    - RABBITMQ_HOST=rabbitmq
    - BATCH_SIZE=10
    - REPLICA_ID=0
    - CONTROL_EXCHANGE_NAME=average_filter_control
    - RECENT_QUEUE_NAME=recent_queue
    - AVERAGE_EXCHANGE=average
    - RESULTS_QUEUE_NAME=results_queue
    - TOKENIZER_REPLICAS=1
    - SUM_JOIN_AMOUNT=1
    - STORE_PATH=/tmp/average_filter_store
    - PYTHONUNBUFFERED=1