services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - year_filter_0
    environment:
    - INPUT_FILE=/datasets/test.parquet
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBITMQ_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - RESULTS_QUEUE=results_queue
    - TOKENIZER_QUEUE=tokenizer_queue
    - YEAR_FILTER_QUEUE=year_filter_queue
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  sum_worker_0:
    build:
      context: ./src/
      dockerfile: sum_worker/Dockerfile
    container_name: sum_worker_0
    depends_on:
    - gateway
    environment:
    - BATCH_SIZE=100
    - ID=0
    - INPUT_QUEUE_NAME=article_language_queue
    - Q1_OUTPUT_QUEUE_NAME=sum_queue
  sum_join_0:
    build:
      context: ./src/
      dockerfile: sum_join/Dockerfile
    container_name: sum_join_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBITMQ_HOST=rabbitmq
    - REPLICA_ID=0
    - PREVIOUS_STAGE_REPLICAS=2
    - SUM_JOIN_EXCHANGE=sum_join
    - AVERAGE_EXCHANGE=average
    - AVERAGE_FILTER_AMOUNT=1
    - BATCH_SIZE=10
    - PYTHONUNBUFFERED=1
  sum_0:
    build:
      context: ./src/
      dockerfile: sum/Dockerfile
    container_name: sum_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      sum_join_0:
        condition: service_started
    environment:
    - RABBITMQ_HOST=rabbitmq
    - REPLICA_ID=sum_0
    - PREVIOUS_STAGE_REPLICAS=1
    - INPUT_QUEUE_NAME=abstract_lengths_queue
    - CONTROL_EXCHANGE_NAME=sum_control
    - CONTROL_ROUTING_KEY=sum
    - SUM_JOIN_EXCHANGE=sum_join
    - SUM_JOIN_AMOUNT=2
    - BATCH_SIZE=10
    - PYTHONUNBUFFERED=1
average_filter_0:
    build:
      context: ./src/
      dockerfile: average_filter/Dockerfile
    container_name: average_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      sum_join_0:
        condition: service_started
    environment:
    - RABBITMQ_HOST=rabbitmq
    - BATCH_SIZE=10
    - REPLICA_ID=average_filter_0
    - CONTROL_EXCHANGE_NAME=average_filter_control
    - RECENT_QUEUE_NAME=recent_queue
    - AVERAGE_EXCHANGE=average
    - RESULTS_QUEUE_NAME=results_queue
    - TOKENIZER_REPLICAS=1
    - SUM_JOIN_AMOUNT=1
    - STORE_PATH=/tmp/average_filter_store
    - PYTHONUNBUFFERED=1