services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - year_filter_0
    environment:
    - INPUT_FILE=/datasets/test.parquet
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBITMQ_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - RESULTS_QUEUE=results_queue
    - TOKENIZER_QUEUE=tokenizer_queue
    - YEAR_FILTER_QUEUE=year_filter_queue
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  sum_worker_0:
    build:
      context: ./src/
      dockerfile: sum_worker/Dockerfile
    container_name: sum_worker_0
    depends_on:
    - gateway
    environment:
    - BATCH_SIZE=100
    - ID=0
    - INPUT_QUEUE_NAME=article_language_queue
    - Q1_OUTPUT_QUEUE_NAME=sum_queue
  sum_joiner_0:
    build:
      context: ./src/
      dockerfile: sum_joiner/Dockerfile
    container_name: sum_joiner_0
    depends_on:
    - gateway
    environment:
    - BATCH_SIZE=100
    - ID=0
    - INPUT_QUEUE_NAME=sum_queue
    - Q1_OUTPUT_QUEUE_NAME=results_queue